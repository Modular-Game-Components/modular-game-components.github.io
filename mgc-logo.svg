<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#79E8D9"/>
      <stop offset="1" stop-color="#4CC2B2"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7C766"/>
      <stop offset="1" stop-color="#E8A93A"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="28" fill="#1e2327"/>

  <!-- Connector studs bridging the gaps (drawn first, sit behind blocks) -->
  <circle cx="100" cy="70" r="6" fill="#3a4147"/>
  <circle cx="70" cy="100" r="6" fill="#3a4147"/>
  <circle cx="130" cy="100" r="6" fill="#3a4147"/>
  <circle cx="100" cy="130" r="6" fill="#3a4147"/>

  <!-- Modular blocks forming a D-pad / gamepad cluster -->

  <!-- Top block -->
  <rect x="78" y="34" width="44" height="44" rx="10" fill="url(#teal)" stroke="#2c3438" stroke-width="2"/>
  <!-- star detail (quality / achievement marker) -->
  <path d="M100,43 L103.77,50.8 L112.35,51.97 L106.24,57.56 L107.67,66.27 L100,61.85 L92.33,66.27 L93.76,57.56 L87.65,51.97 L96.23,50.8 Z" fill="#1e2327" opacity="0.45"/>

  <!-- Left block -->
  <rect x="34" y="78" width="44" height="44" rx="10" fill="url(#teal)" stroke="#2c3438" stroke-width="2"/>
  <!-- four-direction arrow cluster (up, right, down, left) -->
  <path d="M56 86 L61 94 L51 94 Z" fill="#1e2327" opacity="0.45"/>
  <path d="M56 114 L61 106 L51 106 Z" fill="#1e2327" opacity="0.45"/>
  <path d="M42 100 L50 95 L50 105 Z" fill="#1e2327" opacity="0.45"/>
  <path d="M70 100 L62 95 L62 105 Z" fill="#1e2327" opacity="0.45"/>

  <!-- Center block (accent, "core") -->
  <rect x="78" y="78" width="44" height="44" rx="10" fill="url(#amber)" stroke="#a6741f" stroke-width="2"/>
  <!-- X mark: "X marks the spot" / X button, game-themed -->
  <g opacity="0.45">
    <line x1="90" y1="90" x2="110" y2="110" stroke="#1e2327" stroke-width="7" stroke-linecap="round"/>
    <line x1="110" y1="90" x2="90" y2="110" stroke="#1e2327" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Right block -->
  <rect x="122" y="78" width="44" height="44" rx="10" fill="url(#teal)" stroke="#2c3438" stroke-width="2"/>
  <!-- two small action buttons -->
  <circle cx="138" cy="92" r="5" fill="#1e2327" opacity="0.45"/>
  <circle cx="152" cy="106" r="5" fill="#1e2327" opacity="0.45"/>

  <!-- Bottom block -->
  <rect x="78" y="122" width="44" height="44" rx="10" fill="url(#teal)" stroke="#2c3438" stroke-width="2"/>
  <!-- gem/treasure detail, ties into "X marks the spot" theme -->
  <path d="M92,138 L108,138 L112,144 L100,156 L88,144 Z" fill="#1e2327" opacity="0.45"/>
</svg>
